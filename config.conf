# Basic Configuration
ip-address = 0.0.0.0
port = 8081
root = ./website
index = index.html;index.htm
404-error = 404.html
403-error = 403.html
trusted-proxies =

# HTTPS Configuration
enable-https = false
cert-file = server.crt
key-file = server.key
https-port = 8443

# Logging Configuration
log-buffer-size = 1MiB
log-flush-threshold = 75
log-flush-interval = 5
log-max-entries = 12500
